<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anemoia</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh; 
  }

  html {
    /* 	You could spend a thousand lifetimes staring at water and sand,
        thinking as hard as you could,
        and you'd never guess the world had things like this in it. */
    background-image: url(assets/img/intro-bg.jpg); 
    background-size: cover;
    background-position: center center; 
    background-repeat: no-repeat; 
    
    background-attachment: fixed; 
  }
  main, div {
    width: 320px; height: 100%; margin-left: -160px;
    position: fixed; left: 50%;
    display: flex; flex-flow: column; justify-content: center; align-items: center;
    text-align: center;
  }
  a {
    background: url("assets/img/monke_converted.png");
    width: 280px;
    height: 280px;
    border: none;
    filter: grayscale(1);
    background-size: contain;
  }
  a:hover {
    background: url("assets/img/bait_converted.png");
    background-size: contain;
  }
</style>
</head>
<body>
<main>
  <div>
    <a href="main.html"></a>
  </div>
</main>
</body>
</html>
