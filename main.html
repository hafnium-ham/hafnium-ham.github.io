<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anemoia</title>
<script src="assets/js/site.js" defer></script>
<style>
  :root {
    --card-bg: #cfcfcf;
    --card-text: #16151a;
    --face-lo: #808080;
    --nav-bg: #3a2a55;
  }

  * { box-sizing: border-box; }

  body {
    font-family: Tahoma, Verdana, Arial, sans-serif;
    margin: 0;
    padding: 1.5rem;
    color: #1a1814;
    background: url('assets/img/backgrnd.jpg') center/cover no-repeat fixed;
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: -1;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1.6fr 1fr;
    gap: 14px;
    align-items: start;
    max-width: 1100px;
    margin: 0 auto;
  }

  .col {
    min-width: 0; 
    padding: 16px;
    background: var(--card-bg);
    color: var(--card-text);
    border-radius: 6px;
    border: 1px solid var(--face-lo);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .col.col-right { display: none; } 
  }

  h1, h2 { font-family: Tahoma, Verdana, sans-serif; color: var(--card-text); }
  h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 2px solid var(--face-lo);
    padding-bottom: 4px; margin: 0 0 10px;
  }

  nav.tabs {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 20px;
  }
  nav.tabs a {
    text-decoration: none;
    color: var(--card-text);
    background: transparent;
    padding: 10px 4px;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--face-lo);
    display: block;
    transition: color 0.1s ease;
  }
  nav.tabs a:last-child {
    border-bottom: none;
  }
  nav.tabs a:hover { 
    color: #8c53d4; 
  }
  nav.tabs a.active { 
    color: #5c2c9c; 
    font-weight: bold; 
  }

  .hover-imgs {
    position: fixed;
    bottom: 180px; 
    right: 110px; 
    width: 220px;
    height: 220px;
    z-index: 50;
    pointer-events: none;
    transform: scale(0.2); 
    transform-origin: bottom right;
  }
  .hover-imgs img {
    position: absolute;
    display: block;
    will-change: transform;
  }
  
  .hover-imgs .h1 { top: 90px;   left: 60px; }
  .hover-imgs .h2 { top: 180px; left: 77px; }
  .hover-imgs .h3 { top: 600px; left: 180px; }
  .hover-imgs .h4 { top: 80px; left: 60px; }
</style>
</head>
<body>

<div class="layout">

<div class="col col-left">

  </nav>
</div>

<div class="col col-center">

  </ul>
</div>

<div class="col col-right">

      Multiplayer card game, not finished and may never be. Source on <a href="https://github.com/hafnium-ham/mao_game">GitHub</a>.
    </p>
    <p>
      <a href="oracle.html">Aaronson Oracle</a> — Markov chain predicts if you will choose left or right.
    </p>
    <p>
      <a href="https://github.com/dman7351/mogwai">MOGWAI</a> — Stress test toolkit for CI/CD pipelines
    </p>
  </details>
</div>

</div>

<div class="hover-imgs">
  <img class="h1" src="assets/img/callie copy.png" alt="">
  <img class="h2" src="assets/img/callie copy2.png" alt="">
  <img class="h3" src="assets/img/callie copy3.png" alt="">
  <img class="h4" src="assets/img/callie copy4.png" alt="">
</div>

</body>
</html>
